[app]
name = "Backup Tool"

[backup]
default_local_folder = "C:/SQLBackups"
default_retention_days = 14
compression_enabled = true
checksum_enabled = true

[cloud]
# Cloud authentication is managed by rclone, not by this file.
default_remote_path = "SQLBackups"

[mssql]
default_driver = "ODBC Driver 18 for SQL Server"
trust_server_certificate = true
